services:
  autodocker:
    container_name: autodocker
    build: .
    # 也可以直接使用预构建镜像（Docker Hub 为主，GHCR 同步发布）：
    # image: haihaipypy/autodocker:1.2.3
    # image: ghcr.io/haihaipypy/autodocker:1.2.3
    restart: unless-stopped
    ports:
      # 默认 17777，刻意避开 8080 / 8000 / 9000 这些几乎必被占用的端口。
      # 要换端口就两处一起改：左边宿主机端口 + 下面的 PORT，两者保持一致。
      - "17777:17777"
    volumes:
      # 必须挂载：这是监控与重建容器的基础
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - PORT=17777
      - DB_PATH=/data/autodocker.db
      - DOCKER_HOST=unix:///var/run/docker.sock

      # 自身容器名：用于阻止「更新自己」这种自杀行为
      - SELF_CONTAINER=autodocker

      # 巡检间隔（秒）。0 表示关闭定时扫描，仅手动触发
      - SCAN_INTERVAL=3600

      # 更新策略：默认「发现更新 → 通知 → 等人确认」。
      # 若想发现即自动更新，把下一行打开（这是无人值守模式，请先确认回滚策略可用）
      # - AUTO_UPDATE=true

      # 额外监控本机没有运行的镜像（逗号分隔，纯远端巡检）
      # - WATCH=nginx:1.25,redis:7.2

      # ---- 飞书通知（默认留空：不填就只是不推通知，其它功能照常）----
      # 建议装好进网页「设置 → 飞书通知」里填：存数据库、即时生效、不用重启。
      # 这里的三个值只作为**首次启动**的初值，数据库里已有值时以数据库为准。
      # 注意：必须是「企业自建应用」，群自定义机器人（webhook）收不到按钮点击。
      - FEISHU_APP_ID=
      - FEISHU_APP_SECRET=
      - FEISHU_CHAT_ID=

      # ---- 网页登录（默认留空：不启用登录，打开就能用）----
      # 挂载了 docker.sock，一旦要让端口离开内网，务必设上密码（同样是网页设置里改最方便）。
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=

      # ---- 更新策略 ----
      # 更新失败自动回滚到旧容器
      - ROLLBACK_ON_FAILURE=true
      # 更新成功后保留旧容器（默认删除）
      - KEEP_OLD_CONTAINER=false
      # 新容器健康检查观察窗口（秒）
      - HEALTH_CHECK_WAIT=20

      # ---- 可选：国内加速 / 私有注册表代理 ----
      # 留空即按「Docker 守护进程的 registry-mirrors → 内置默认」兜底，
      # 内置默认是 docker.1ms.run,docker.xuanyuan.me
      # - REGISTRY_MIRROR=docker.1ms.run,docker.xuanyuan.me
      # - REGISTRY_INSECURE=false
      # - REGISTRY_AUTH=docker.io=user:pass,ghcr.io=ghp_xxx
