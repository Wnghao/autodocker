name: Build & Push Image

# 触发规则（按需裁剪）：
#   - push 到 main        → 构建 linux/amd64 + linux/arm64，推 latest、main、sha-xxxx
#   - push tag v1.2.3     → 额外推 1.2.3、1.2 两个版本号标签
#   - Pull Request        → 只构建校验，不推送
#   - 手动触发（Actions 页面上的 Run workflow）
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository 就是 haihaipypy/autodocker，镜像名会自动对上
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 推 GHCR 必须给这个权限，缺了会报 403 denied
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 交叉编译 arm64 需要 QEMU（Go 本身能交叉编译，但构建阶段跑在 amd64 上）
      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        # PR 来自 fork 时没有写权限，跳过登录
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 注意：tags 里不能写 # 注释 —— 它整块会被当成标签规则列表逐行解析，
          # 注释行会被当成非法规则。要注释就写在外面（像这一行）。
          # 分支构建只给 branch / sha，不抢 latest；
          # latest 只在打 v* tag 时移动，否则 main 上的半成品会变成「最新版」。
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # 飞牛 NAS 有 x86 也有 ARM 机型，两个平台一起出
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 复用上一次构建的层，Go 依赖那层不用每回重下
          cache-from: type=gha
          cache-to: type=gha,mode=max
